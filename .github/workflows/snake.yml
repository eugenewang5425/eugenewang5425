# ================================================================
# 自动生成「贡献蛇形动画」的 GitHub Actions 工作流
# 放到你的 profile 仓库（eugenewang5425/eugenewang5425）下：
#   .github/workflows/snake.yml
# 运行后会把生成的 SVG 提交到 output 分支根目录，README 中的
#   raw.githubusercontent.com/eugenewang5425/eugenewang5425/output/...
# 即可正常显示。
# ================================================================

name: generate github-contribution-grid-snake

on:
  schedule:
    # 每天 UTC 00:17 运行一次（北京时间约 08:17）。
    # 等 GitHub 服务器跨日后再生成，避免周日的贡献格整体错开一周。
    - cron: "17 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: commit and push to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git add -f github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git commit -m "chore: regenerate contribution snake" || echo "no changes"
          git push -f origin output
