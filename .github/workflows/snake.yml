# ================================================================
# 自动生成「贡献蛇形动画」的 GitHub Actions 工作流
# 放到你的 profile 仓库（eugenewang5425/eugenewang5425）下：
#   .github/workflows/snake.yml
# 运行后它会推送到 output 分支，README 中的
#   raw.githubusercontent.com/eugenewang5425/eugenewang5425/output/...
# 即可正常显示。
# ================================================================

name: generate github-contribution-grid-snake

on:
  schedule:
    # 每天 UTC 18:00 运行一次（北京时间约次日 02:00）
    - cron: "0 18 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
